{% extends 'partials/sidebar_base.html' %}
{% block title %}Editar categoría | Panel Canaco{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="card shadow rounded">
        <div class="card-body">
            <h1 class="mb-4 text-center">Editar categoría</h1>
            {% if messages %}{% for message in messages %}<div class="alert alert-{{ message.tags }}" role="alert">{{ message }}</div>{% endfor %}{% endif %}
            <form method="post">
                {% csrf_token %}
                <div class="mb-3"><label for="nombre" class="form-label">Nombre</label><input type="text" id="nombre" name="nombre" class="form-control" value="{{ categoria.nombre }}" required></div>
                <div class="d-flex gap-2"><button type="submit" class="btn btn-primary">Guardar cambios</button><a href="{% url 'home:crud_categorias' %}" class="btn btn-outline-secondary">Cancelar</a></div>
            </form>
        </div>
    </div>
</div>
{% endblock content %}
