{% with current=request.resolver_match.url_name %}
<aside class="panel-sidebar flex-shrink-0" aria-label="Menú del panel">
    <ul class="nav nav-pills nav-flush flex-column mb-auto text-start">
        <li class="nav-item">
            <a href="{% url 'home:perfil' %}" class="nav-link panel-nav-link {% if current == 'perfil' or current == 'crud_perfil' %}active{% endif %}">
                <span>Mi perfil</span>
            </a>
        </li>
        <li><a href="{% url 'home:crud_noticia' %}" class="nav-link panel-nav-link {% if current == 'crud_noticia' or current == 'crear_publicacion' %}active{% endif %}"><span>Noticias</span></a></li>
        <li><a href="{% url 'home:crud_comentarios' %}" class="nav-link panel-nav-link {% if current == 'crud_comentarios' %}active{% endif %}"><span>Comentarios</span></a></li>
        <li><a href="{% url 'home:crud_categorias' %}" class="nav-link panel-nav-link {% if current == 'crud_categorias' %}active{% endif %}"><span>Categorías</span></a></li>
        <li><a href="{% url 'home:crud_usuarios' %}" class="nav-link panel-nav-link {% if current == 'crud_usuarios' or current == 'crear_usuario' %}active{% endif %}"><span>Usuarios</span></a></li>
        <li><a href="{% url 'home:crud_cambiar_contrasena' %}" class="nav-link panel-nav-link {% if current == 'crud_cambiar_contrasena' %}active{% endif %}"><span>Cambiar contraseña</span></a></li>
        <li class="mt-3">
            <a href="{% url 'home:login' %}" class="btn btn-danger panel-logout-button w-100">Cerrar sesión</a>
        </li>
    </ul>
</aside>
{% endwith %}
