{% load static %}
<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Noticias y novedades de Canaco">
    <link rel="shortcut icon" href="{% static 'favicon.png' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'biznews/css/style.css' %}">
    <title>{% block title %}Canaco{% endblock %}</title>
</head>
<body>
    {% include 'partials/biznews_header.html' %}
    {% block content %}{% endblock content %}
    {% include 'partials/biznews_footer.html' %}
    <a href="#" class="btn btn-primary btn-square back-to-top" aria-label="Volver arriba"><i class="fa fa-arrow-up"></i></a>
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
